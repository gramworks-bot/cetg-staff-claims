<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CETG Transport &amp; Expense Claim Form</title>
<meta name="description" content="Add receipt screenshots, check the amounts, sign the month's claim and send it for approval.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1e40af">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CETG Claims">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></symbol>

</svg>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1e40af"/><path d="M10 7h12v17.5l-2-1.6-2 1.6-2-1.6-2 1.6-2-1.6-2 1.6z" fill="#fff"/><path d="M12.8 13.8l2.3 2.3 4.1-4.6" fill="none" stroke="#1e40af" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div>
        <h1 id="app-title">CETG Transport &amp; Expense Claim Form</h1>
        <p id="app-tag">Receipts in, signed claim out</p>
      </div>
    </div>
    <div class="tabs" role="tablist" aria-label="Sections">
      <button type="button" role="tab" id="tab-claims" aria-selected="true" aria-controls="view">My claims</button>
      <button type="button" role="tab" id="tab-approve" aria-selected="false" aria-controls="view" tabindex="-1">Approver</button>
    </div>
    <button type="button" class="icon-btn" id="btn-settings" aria-label="Settings" title="Settings"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg></button>
  </div>
</header>

<!-- Messages come before the page in reading order, so a button on a message ("Show") is easy to reach. -->
<div id="toast-root"></div>
<main id="view" class="wrap" role="tabpanel" aria-labelledby="tab-claims" tabindex="-1">
  <p class="muted" id="boot">Opening the claim form…</p>
</main>

<div id="bar" class="bar" role="region" aria-label="Claim total and next step" hidden></div>
<div id="modal-root"></div>
<!-- Things that happen by themselves (a receipt finished reading, a message) are told to screen readers here. -->
<div id="sr" class="sr-only" role="status" aria-live="polite"></div>
<div id="drop-veil" hidden>Drop to add</div>

<input type="file" id="pick-images" accept="image/*" multiple hidden>
<input type="file" id="pick-camera" accept="image/*" capture="environment" hidden>
<input type="file" id="pick-attach" accept="image/*" hidden>
<input type="file" id="pick-pdf" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="pick-backup" accept="application/json,.json" hidden>
<input type="file" id="pick-bringback" accept="application/pdf,.pdf" multiple hidden>

<noscript><p style="padding:16px">This claim form needs JavaScript turned on.</p></noscript>

<script defer src="js/util.js"></script>
<script defer src="js/parse.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/ocr.js"></script>
<script defer src="js/claimpdf.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/app.js"></script>
<script defer src="js/approve.js"></script>
</body>
</html>
